# Nginx Configuration for Video Courses Monorepo (Frontend + Backend)
# Place this file in /etc/nginx/sites-available/your-domain.conf and symlink to sites-enabled.

upstream api_backend {
    # Node.js Express server running on port 3000 (Default)
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    # domain: классный-фокус.рф
    server_name xn----7sb1acdcpkxafxk9g.xn--p1ai www.xn----7sb1acdcpkxafxk9g.xn--p1ai;

    # Redirect all HTTP requests to HTTPS for security
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # domain: классный-фокус.рф
    server_name xn----7sb1acdcpkxafxk9g.xn--p1ai www.xn----7sb1acdcpkxafxk9g.xn--p1ai;

    # SSL Certificate Paths (Adjust these paths based on Let's Encrypt / Certbot output)
    ssl_certificate /etc/letsencrypt/live/xn----7sb1acdcpkxafxk9g.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn----7sb1acdcpkxafxk9g.xn--p1ai/privkey.pem;

    # SSL Security Best Practices
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Client upload size limit (crucial for video/image uploads)
    client_max_body_size 500M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 1. Frontend Static Files (Vite build outputs to artifacts/video-courses/dist/public)
    # Adjust this path to the absolute directory where your project is uploaded on Beget VPS
    root /var/www/video-courses/artifacts/video-courses/dist/public;
    index index.html;

    # SPA Router fallback (try to serve file, then directory, then fallback to index.html)
    location / {
        try_files $uri $uri/ /index.html;
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }

    # Cache static assets (Vite assets folder containing compiled js/css)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Dynamic sitemap routing
    location = /sitemap.xml {
        proxy_pass http://api_backend/api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Backend API Reverse Proxy (Express server)
    location /api/ {
        proxy_pass http://api_backend;
        
        # Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 3. MinIO Storage Proxy (serves MinIO over HTTPS to avoid Mixed Content errors)
    # Presigned URLs will use this domain, so browser requests stay on HTTPS
    location ~* ^/(videos-prod|videos-dev|video-courses)/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for large video uploads (500MB)
        client_max_body_size 500M;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Optional: Cache control for favicon, robots.txt, and general assets
    location ~* ^/(?!api/).*\.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf|otf|txt)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Logs
    access_log /var/log/nginx/video_courses_access.log;
    error_log /var/log/nginx/video_courses_error.log warn;
}
