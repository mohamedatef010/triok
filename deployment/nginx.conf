# Nginx Configuration for Video Courses Monorepo (Frontend + Backend)
# Place this file in /etc/nginx/sites-available/your-domain.conf and symlink to sites-enabled.

upstream api_backend {
    # Node.js Express server running on port 3000 (Default)
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    # domain: классный-фокус.рф
    server_name xn----7sb1acdcpkxafxk9g.xn--p1ai www.xn----7sb1acdcpkxafxk9g.xn--p1ai;

    # Redirect all HTTP requests to HTTPS for security
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # domain: классный-фокус.рф
    server_name xn----7sb1acdcpkxafxk9g.xn--p1ai www.xn----7sb1acdcpkxafxk9g.xn--p1ai;

    # SSL Certificate Paths (Adjust these paths based on Let's Encrypt / Certbot output)
    ssl_certificate /etc/letsencrypt/live/xn----7sb1acdcpkxafxk9g.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn----7sb1acdcpkxafxk9g.xn--p1ai/privkey.pem;

    # SSL Security Best Practices
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Client upload size limit (crucial for video/image uploads)
    client_max_body_size 500M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 1. Frontend Static Files (Vite build outputs to artifacts/video-courses/dist/public)
    # Adjust this path to the absolute directory where your project is uploaded on Beget VPS
    root /var/www/video-courses/artifacts/video-courses/dist/public;
    index index.html;

    # SPA Router fallback (try to serve file, then directory, then fallback to index.html)
    location / {
        try_files $uri $uri/ /index.html;
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }

    # Cache static assets (Vite assets folder containing compiled js/css)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Dynamic sitemap routing
    location = /sitemap.xml {
        proxy_pass http://api_backend/api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Backend API Reverse Proxy (Express server)
    location /api/ {
        proxy_pass http://api_backend;
        
        # Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable any nginx-level response caching for API routes.
        # This ensures that dynamic site-settings (hero text, colors, etc.)
        # are NEVER served from a stale cache — admin changes appear immediately.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header X-Proxy-Cache "BYPASS" always;
    }

    # 3. MinIO Storage Proxy (serves MinIO over HTTPS to avoid Mixed Content errors)
    # Presigned URLs will use this domain, so browser requests stay on HTTPS

    # HLS .ts video segments — cache at the browser & nginx edge for 24h
    # Segments are immutable content, so caching is completely safe.
    location ~* ^/(videos-prod|videos-dev|video-courses)/.*\.ts$ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Range, Content-Type, x-amz-*, X-Amz-*' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Segments are immutable — cache in browser for 24h, zero re-downloads
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400, immutable" always;
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;

        # Stream directly — no buffering, fastest possible delivery
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Enable TCP_NODELAY for minimal latency on each segment fetch
        tcp_nodelay on;
        client_max_body_size 500M;
    }

    location ~* ^/(videos-prod|videos-dev|video-courses)/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, HEAD' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, User-Agent, DNT, Cache-Control, X-Mx-ReqToken, Keep-Alive, X-Requested-With, If-Modified-Since, x-amz-*, X-Amz-*, x-amz-checksum-crc32, x-amz-sdk-checksum-algorithm' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for large video uploads (500MB)
        client_max_body_size 500M;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 4. Video Streaming Direct Proxy (Preview videos & Author Media)
    #    Zero-buffering streaming directly to client for seamless, stutter-free playback.
    location ~* ^/api/(preview-videos|author-media)/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering for instant streaming delivery
        proxy_buffering off;
        proxy_request_buffering off;
        tcp_nodelay on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        
        # Support Range requests and browser caching
        add_header Accept-Ranges bytes;
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;
    }

    # 5. Image Thumbnails Proxy — MUST come before static assets rule
    #    Uploaded images (WebP) are stored in S3/MinIO and served via the API.
    #    Without this explicit block, the *.webp regex below would intercept requests
    #    and try to serve from the static root folder (returning 404).
    location /api/thumbnails/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Long cache since images are immutable (content-hashed filenames)
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Optional: Cache control for favicon, robots.txt, and general assets
    location ~* ^/(?!api/).*\.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf|otf|txt)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Logs
    access_log /var/log/nginx/video_courses_access.log;
    error_log /var/log/nginx/video_courses_error.log warn;
}
